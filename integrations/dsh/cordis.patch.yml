# Connect the LoomHarness stdio MCP server to DeepSeek Harness agents.
# Install this directory with Plugins → Add plugin or plugin_manager install_bundle.
# First replace <HELPER> with the absolute path to the installed scripts/mcp_server.py.
# The default installation is ~/.agents/skills/loomharness/scripts/mcp_server.py.
# @deepseek-ai/dsh-mcp-client uses serverName, transport, command and args.
- type: service
  name: mcp-loomharness
  package: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: loomharness
    transport: stdio
    command: python
    args: ['-I', '-X', 'utf8', '<HELPER>']
    failOnStartupError: false
