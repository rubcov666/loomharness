name: Verify installer and hooks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LOOMHARNESS_REPO: ${{ github.workspace }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.170.0
      - name: Check installation and Codex hook registration
        run: python -X utf8 tests/verify_install.py --codex
      - name: Check project choices and evidence gates
        run: python -X utf8 tests/verify_harness.py loomharness/scripts/harness.py
      - name: Check Windows SSH status and session forwarding
        run: python -X utf8 tests/verify_ssh_windows.py
      - name: Check compact output, instruction audit and code map
        run: python -X utf8 tests/verify_context.py
      - name: Check portable history compaction, native settings and MCP
        run: python -X utf8 tests/verify_history.py
      - name: Check automatic report selection and diagnostic preservation
        run: python -X utf8 tests/verify_views.py
      - name: Check portable record filters, evidence and MCP
        run: python -X utf8 tests/verify_records.py
      - name: Check plan questions and fresh evidence
        run: python -X utf8 tests/verify_plan.py
      - name: Check role ownership, dispatch, review and team usage
        run: python -X utf8 tests/verify_team.py
      - name: Check organized teams and optional Git
        run: python -X utf8 tests/verify_organization.py
      - name: Check survey capacity and owner decisions
        run: python -X utf8 tests/verify_initiative.py
      - name: Check coordinator updates, model routing and metric windows
        run: python -X utf8 tests/verify_efficiency.py
      - name: Check first team model choices and saved routing
        run: python -X utf8 tests/verify_model_choice.py
      - name: Check partial snapshots, resource conflicts and concurrent reporting
        run: python -X utf8 tests/verify_board_optimizations.py
      - name: Check background review, model qualification and revocation
        run: python -X utf8 tests/verify_adaptive_team.py
      - name: Check selective tool lookup and chat wait examples
        run: node tests/verify_tool_examples.cjs
      - name: Check the OpenCode v1 and v2 hooks with the Python core
        run: node tests/verify_opencode.mjs
      - name: Check report exports and interrupted service actions
        run: python -X utf8 tests/verify_workflows.py
      - name: Check cached compilation and the final user scenario
        run: python -X utf8 tests/verify_javac.py
      - name: Check compact I/O caps, review run logs, WAL, javac stamps and git-status cache
        run: python -X utf8 tests/verify_compact_io.py
      - name: Check core audit invariants
        run: python -X utf8 tests/test_core_audit.py
      - name: Check self-update rollback smoke
        run: python -X utf8 tests/git_rollback_smoke.py
      - name: Check self-update guards, apply modes and rollback
        run: python -X utf8 tests/verify_update.py
